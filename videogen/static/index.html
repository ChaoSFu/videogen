<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>videogen</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8a90a0;
    --accent: #4f8cff;
    --ok: #35c46b;
    --err: #ef5350;
    --warn: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    background: #0d0f13;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  ::placeholder { color: var(--muted); opacity: 1; }
  input.invalid { border-color: var(--warn); }
  .hint.warn { color: var(--warn); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .row.two { grid-template-columns: repeat(2, 1fr); }
  .field { margin-bottom: 14px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #3a3f4b; cursor: not-allowed; color: var(--muted); }
  .status-line { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: rgba(53,196,107,.15); color: var(--ok); }
  .badge.err { background: rgba(239,83,80,.15); color: var(--err); }
  .badge.busy { background: rgba(217,164,65,.15); color: var(--warn); }
  video { width: 100%; border-radius: 8px; background: #000; display: block; }
  .result-meta { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .history-card { background: #0d0f13; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .history-card video { border-radius: 0; }
  .history-card .hc-body { padding: 10px; }
  .history-card .hc-prompt { font-size: 12px; color: var(--text); margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; transition: color .15s; }
  .history-card .hc-prompt:hover { color: var(--accent); }
  .history-card .hc-prompt.copied { color: var(--ok) !important; }
  .history-card .hc-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .history-card .hc-fail { padding: 10px; font-size: 12px; color: var(--err); }
  .empty { color: var(--muted); font-size: 13px; }
  .backend-line { font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 14px; }
  .error-box { background: rgba(239,83,80,.1); border: 1px solid rgba(239,83,80,.3); color: #ff9d9a; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .current-job { background: rgba(217,164,65,.08); border: 1px solid rgba(217,164,65,.35); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; display: none; }
  .current-job .cj-prompt { color: var(--text); margin: 4px 0 0; }
  .current-job .cj-meta { color: var(--warn); display: flex; align-items: center; gap: 8px; }
  .frame-upload { display: flex; align-items: center; gap: 10px; }
  .frame-upload input[type=file] { width: auto; flex: 1; font-size: 12px; }
  .frame-preview { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); display: none; }
  .frame-clear { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 400; cursor: pointer; display: none; }
  .hint { font-size: 12px; color: var(--muted); margin: -8px 0 14px; }
  .ref-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .ref-chip { display: flex; align-items: center; gap: 6px; background: #0d0f13; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 12px; max-width: 220px; }
  .ref-chip img { width: 22px; height: 22px; object-fit: cover; border-radius: 50%; flex-shrink: 0; }
  .ref-chip .ref-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--border); font-size: 12px; flex-shrink: 0; }
  .ref-chip .ref-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref-chip .ref-remove { cursor: pointer; color: var(--muted); font-weight: 700; padding: 0 2px; flex-shrink: 0; }
  .ref-chip .ref-remove:hover { color: var(--err); }
  .hc-actions { display: flex; gap: 6px; margin-top: 8px; }
  .hc-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 400; cursor: pointer; }
  .hc-btn:hover { color: var(--text); border-color: var(--accent); }
  .hc-btn.danger:hover { color: var(--err); border-color: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <h1>videogen</h1>
  <p class="sub">统一视频生成服务 — 当前 backend：MiniMax-H3（T2VA / FL2VA / Ref2VA）</p>

  <div id="current-job" class="current-job">
    <div class="cj-meta"><span class="spinner"></span> <span id="cj-text"></span></div>
    <p class="cj-prompt" id="cj-prompt"></p>
  </div>

  <div class="panel">
    <h2>生成新视频</h2>
    <div id="backend-line" class="backend-line">正在检查 backend 状态...</div>
    <div class="field">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="A cinematic wide shot of ocean waves under moonlight"></textarea>
    </div>
    <div class="row two">
      <div class="field">
        <label for="first-frame">首帧图片（可选）</label>
        <div class="frame-upload">
          <input type="file" id="first-frame" accept="image/*">
          <img id="first-frame-preview" class="frame-preview">
          <button type="button" class="frame-clear" id="first-frame-clear" onclick="clearFrame('first-frame')">清除</button>
        </div>
      </div>
      <div class="field">
        <label for="last-frame">尾帧图片（可选）</label>
        <div class="frame-upload">
          <input type="file" id="last-frame" accept="image/*">
          <img id="last-frame-preview" class="frame-preview">
          <button type="button" class="frame-clear" id="last-frame-clear" onclick="clearFrame('last-frame')">清除</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="ref-files">参考图片/视频/音频（可选，Ref2VA — 最多 9 图 + 3 视频 + 3 音频，合计 12 个）</label>
      <input type="file" id="ref-files" accept="image/*,video/*,audio/*" multiple>
      <div id="ref-list" class="ref-list"></div>
    </div>
    <p class="hint">Prompt 始终生效，不管有没有传图片/参考文件。图片/参考文件决定用哪个模式——上传了参考文件走 Ref2VA，没传参考文件但传了首/尾帧走 FL2VA，都没传就是纯文字 T2VA；三者选其一，不会同时按两种模式生成。</p>
    <div class="row">
      <div class="field">
        <label for="duration">时长（秒，5–14.4）</label>
        <input id="duration" type="number" value="5" min="5" max="14.4" step="0.5">
        <p id="duration-hint" class="hint" style="margin:4px 0 0; display:none"></p>
      </div>
      <div class="field">
        <label for="resolution">分辨率</label>
        <select id="resolution">
          <option value="768x768">768 × 768</option>
          <option value="768x1344">768 × 1344（竖屏）</option>
          <option value="1344x768">1344 × 768（横屏）</option>
        </select>
      </div>
      <div class="field">
        <label for="seed">Seed（可选）</label>
        <input id="seed" type="number" placeholder="随机">
      </div>
      <div class="field">
        <label for="steps">推理步数</label>
        <input id="steps" type="number" value="30" min="1">
      </div>
    </div>
    <button id="generate-btn" onclick="generate()">生成</button>
    <div id="status-line" class="status-line" style="display:none"></div>
    <div id="error-box" class="error-box" style="display:none"></div>
  </div>

  <div class="panel" id="result-panel" style="display:none">
    <h2>生成结果</h2>
    <video id="result-video" controls></video>
    <div id="result-meta" class="result-meta"></div>
  </div>

  <div class="panel">
    <h2>历史记录</h2>
    <div id="history" class="history-grid"><div class="empty">加载中...</div></div>
  </div>
</div>

<script>
const API = "";

// H3 的时长约束：视频 VAE 只能编码 17n+5 帧的视频，请求的秒数会先按
// fps 换算成帧数，再向上取整到最近一个 17n+5——如果这个取整结果超过
// MAX_SECONDS*fps（360 帧），H3 直接 400，而不是再夹回 360（实测遇到过：
// 请求 15s -> 360 帧 -> 取整到 362 帧 -> 超限报错）。所以前端能安全用到
// 的时长上限不是 15s，是取整后仍 <=360 帧的最大值，即 345 帧 / 14.375s。
// 这几个常数来自 H3 自己的 core/runner.py（FPS/frame_step/frame_offset/
// MIN_SECONDS/MAX_SECONDS），不是我们发明的，上游要是改了这里也要同步改。
const H3_FPS = 24, H3_FRAME_STEP = 17, H3_FRAME_OFFSET = 5;
const H3_MIN_SECONDS = 5, H3_MAX_SECONDS = 15;
const H3_MAX_FRAMES = H3_MAX_SECONDS * H3_FPS; // 360，硬上限
const H3_MAX_SAFE_FRAMES = Math.floor((H3_MAX_FRAMES - H3_FRAME_OFFSET) / H3_FRAME_STEP) * H3_FRAME_STEP + H3_FRAME_OFFSET; // 345
const H3_MAX_SAFE_SECONDS = H3_MAX_SAFE_FRAMES / H3_FPS; // 14.375

function h3RoundedFrames(seconds) {
  const raw = seconds * H3_FPS;
  const n = Math.max(0, Math.ceil((raw - H3_FRAME_OFFSET) / H3_FRAME_STEP));
  return n * H3_FRAME_STEP + H3_FRAME_OFFSET;
}

// 提交前夹到安全范围，避免"填了个 UI 允许但 H3 会拒绝"的时长——返回
// 实际会用的秒数；如果做了调整，clamped 为 true 方便调用方提示用户。
function clampDurationToSafeRange(seconds) {
  let clamped = false;
  if (seconds < H3_MIN_SECONDS) { seconds = H3_MIN_SECONDS; clamped = true; }
  if (seconds > H3_MAX_SECONDS || h3RoundedFrames(seconds) > H3_MAX_FRAMES) {
    seconds = H3_MAX_SAFE_SECONDS;
    clamped = true;
  }
  return { seconds, clamped };
}

// 实时校验：输入的瞬间就提示，不用等点了"生成"才发现超出范围（尤其是
// prompt 还没填的时候，之前"请先填写 prompt"的检查会挡在前面，用户根本
// 看不到时长有问题）。真正的兜底仍然是 generate() 里提交前的那次 clamp，
// 这里只是提前把同样的判断结果显示出来。
function checkDurationField() {
  const input = document.getElementById("duration");
  const hint = document.getElementById("duration-hint");
  const raw = parseFloat(input.value);
  if (isNaN(raw)) { input.classList.remove("invalid"); hint.style.display = "none"; return; }
  const { seconds, clamped } = clampDurationToSafeRange(raw);
  if (clamped) {
    input.classList.add("invalid");
    hint.className = "hint warn";
    hint.style.display = "block";
    hint.textContent = `超出范围（${H3_MIN_SECONDS}–${H3_MAX_SAFE_SECONDS}s），提交时会自动调整为 ${seconds}s`;
  } else {
    input.classList.remove("invalid");
    hint.style.display = "none";
  }
}
document.getElementById("duration").addEventListener("input", checkDurationField);

function widthHeight() {
  const [w, h] = document.getElementById("resolution").value.split("x").map(Number);
  return { width: w, height: h };
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function clearFrame(inputId) {
  document.getElementById(inputId).value = "";
  const preview = document.getElementById(`${inputId}-preview`);
  preview.src = "";
  preview.style.display = "none";
  document.getElementById(`${inputId}-clear`).style.display = "none";
}

for (const id of ["first-frame", "last-frame"]) {
  document.getElementById(id).addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById(`${id}-preview`);
    const clearBtn = document.getElementById(`${id}-clear`);
    if (!file) { preview.style.display = "none"; clearBtn.style.display = "none"; return; }
    preview.src = await readFileAsDataURL(file);
    preview.style.display = "block";
    clearBtn.style.display = "inline-block";
  });
}

// Ref2VA 参考文件：累积到一个数组里（而不是依赖 <input multiple> 自己的
// FileList——那样每次选择会覆盖上一次，没法"分几次挑文件"），每个 chip
// 带缩略图/类型图标 + 删除按钮。
let refFiles = []; // { file, dataUrl, kind }

function refKind(file) {
  if (file.type.startsWith("image/")) return "image";
  if (file.type.startsWith("video/")) return "video";
  if (file.type.startsWith("audio/")) return "audio";
  return "file";
}

function renderRefList() {
  const el = document.getElementById("ref-list");
  el.innerHTML = refFiles.map((rf, i) => {
    const icon = rf.kind === "image"
      ? `<img src="${rf.dataUrl}">`
      : `<span class="ref-icon">${rf.kind === "video" ? "🎬" : rf.kind === "audio" ? "🎵" : "📄"}</span>`;
    return `<span class="ref-chip">${icon}<span class="ref-name" title="${escapeHtml(rf.file.name)}">${escapeHtml(rf.file.name)}</span><span class="ref-remove" data-remove-ref="${i}">×</span></span>`;
  }).join("");
}

document.getElementById("ref-files").addEventListener("change", async (e) => {
  for (const file of e.target.files) {
    refFiles.push({ file, dataUrl: await readFileAsDataURL(file), kind: refKind(file) });
  }
  e.target.value = ""; // 清空 input 本身的选择状态，方便再挑文件追加
  renderRefList();
});

document.getElementById("ref-list").addEventListener("click", (e) => {
  const idx = e.target.getAttribute("data-remove-ref");
  if (idx === null) return;
  refFiles.splice(Number(idx), 1);
  renderRefList();
});

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString();
  } catch (e) { return iso; }
}

async function refreshBackends() {
  const el = document.getElementById("backend-line");
  try {
    const resp = await fetch(`${API}/v1/backends`);
    const backends = await resp.json();
    const h3 = backends.find(b => b.name === "minimax-h3");
    if (!h3) { el.textContent = "未找到 minimax-h3 backend"; return; }
    const queueNote = h3.queue_depth > 0 ? `，另有 ${h3.queue_depth} 个排队中` : "";
    if (!h3.available) {
      el.innerHTML = `<span class="badge err">不可达</span> ${h3.detail || "H3 runtime 未启动"}`;
    } else if (h3.busy) {
      el.innerHTML = `<span class="badge busy">忙碌</span> 正在处理其他生成请求，H3 是全局串行的，新请求会自动排队${queueNote}`;
    } else {
      el.innerHTML = `<span class="badge ok">就绪</span> minimax-h3${queueNote}`;
    }
  } catch (e) {
    el.innerHTML = `<span class="badge err">无法连接</span> ${e}`;
  }
}

// 轮询"当前正在跑的任务"——不管是这个页面自己发起的、别的标签页、
// 还是直接 curl 打过来的，只要 H3 正在处理，这里都会显示，解决
// "刷新页面看不到正在进行中的任务"的问题。
async function refreshCurrentJob() {
  const box = document.getElementById("current-job");
  try {
    const resp = await fetch(`${API}/v1/videos/current`);
    const job = resp.status === 200 ? await resp.json() : null;
    if (!job) { box.style.display = "none"; return; }
    box.style.display = "block";
    const queueNote = job.queue_depth > 0 ? `，后面还有 ${job.queue_depth} 个排队` : "";
    document.getElementById("cj-text").textContent =
      `${job.backend} 正在生成中，已用时 ${Math.floor(job.elapsed_s)}s${queueNote}`;
    document.getElementById("cj-prompt").textContent = job.prompt;
  } catch (e) {
    box.style.display = "none";
  }
}

function friendlyError(body) {
  const map = {
    backend_busy: "H3 正在处理另一个生成请求（全局串行），请稍后重试。",
    backend_unavailable: "H3 runtime 不可达，请确认 server-h3.sh 是否在运行。",
    invalid_request: "请求参数有问题。",
    generation_failed: "H3 生成失败，请查看 server-h3.sh 终端日志获取详情。",
    backend_timeout: "生成超时，可能是推理时间超过了 H3_REQUEST_TIMEOUT。",
  };
  const head = map[body.error] || body.error || "未知错误";
  return body.detail ? `${head}\n${body.detail}` : head;
}

async function generate() {
  const btn = document.getElementById("generate-btn");
  const statusLine = document.getElementById("status-line");
  const errorBox = document.getElementById("error-box");
  const resultPanel = document.getElementById("result-panel");
  const prompt = document.getElementById("prompt").value.trim();

  errorBox.style.display = "none";
  if (!prompt) {
    errorBox.textContent = "请先填写 prompt";
    errorBox.style.display = "block";
    return;
  }

  const { width, height } = widthHeight();
  const firstFrame = document.getElementById("first-frame-preview").src || "";
  const lastFrame = document.getElementById("last-frame-preview").src || "";
  const hasFrame = firstFrame.startsWith("data:") || lastFrame.startsWith("data:");
  const hasRefs = refFiles.length > 0;

  // 优先级：参考文件(ref2va) > 首/尾帧(fl2va) > 纯文字(t2va)，三选一。
  let mode = "t2va";
  if (hasRefs) mode = "ref2va";
  else if (hasFrame) mode = "fl2va";

  const durationInput = document.getElementById("duration");
  const { seconds: duration, clamped } = clampDurationToSafeRange(parseFloat(durationInput.value) || 5);
  if (clamped) {
    durationInput.value = duration;
    errorBox.style.display = "block";
    errorBox.textContent =
      `时长已自动调整为 ${duration}s——H3 只能编码特定帧数的视频，15s 按 24fps 取整后会超过它自己的硬上限，` +
      `实际能用的上限是 ${H3_MAX_SAFE_SECONDS}s。已继续提交本次生成，之后可以直接用调整后的值。`;
  }

  const body = {
    backend: "minimax-h3",
    mode,
    prompt,
    duration,
    width, height,
    options: { num_inference_steps: parseInt(document.getElementById("steps").value, 10) || 30 },
  };
  if (mode === "ref2va") {
    body.options.references = refFiles.map(rf => ({
      data: rf.dataUrl, filename: rf.file.name, content_type: rf.file.type || undefined,
    }));
  } else if (mode === "fl2va") {
    if (firstFrame.startsWith("data:")) body.options.first_frame = firstFrame;
    if (lastFrame.startsWith("data:")) body.options.last_frame = lastFrame;
  }
  const seedVal = document.getElementById("seed").value;
  if (seedVal !== "") body.seed = parseInt(seedVal, 10);

  btn.disabled = true;
  statusLine.style.display = "flex";
  const started = Date.now();
  statusLine.innerHTML = `<span class="spinner"></span> 生成中，H3 推理是分钟级的，请耐心等待...`;
  const timer = setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    statusLine.innerHTML = `<span class="spinner"></span> 生成中... 已用时 ${s}s`;
  }, 1000);

  try {
    const resp = await fetch(`${API}/v1/videos/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) {
      errorBox.textContent = friendlyError(data);
      errorBox.style.display = "block";
    } else {
      resultPanel.style.display = "block";
      const video = document.getElementById("result-video");
      video.src = data.output.video_url || "";
      document.getElementById("result-meta").innerHTML =
        `${data.mode} · 时长 ${data.output.duration?.toFixed(2)}s · ${data.output.width}×${data.output.height} · ` +
        `seed ${data.metadata.seed} · 耗时 ${data.metadata.generation_time_s?.toFixed(1)}s · ` +
        `峰值显存 ${data.metadata.peak_vram_gb} GB`;
      resultPanel.scrollIntoView({ behavior: "smooth" });
      refreshHistory();
    }
  } catch (e) {
    errorBox.textContent = `请求失败: ${e}`;
    errorBox.style.display = "block";
  } finally {
    clearInterval(timer);
    statusLine.style.display = "none";
    btn.disabled = false;
    refreshBackends();
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// 缓存最近一次 /v1/videos 的结果，按 id 查——复用/删除按钮点击时不用
// 再发一次请求，直接从这里取（含 request_summary，历史卡片本身不显示它）。
let _historyById = {};

async function refreshHistory() {
  const el = document.getElementById("history");
  try {
    const resp = await fetch(`${API}/v1/videos?limit=24`);
    const items = await resp.json();
    _historyById = Object.fromEntries(items.map(it => [it.id, it]));
    if (!items.length) {
      el.innerHTML = `<div class="empty">还没有生成记录</div>`;
      return;
    }
    el.innerHTML = items.map(it => {
      const prompt = escapeHtml(it.prompt);
      const actions = `<div class="hc-actions">
        <button type="button" class="hc-btn" data-reuse="${it.id}">复用</button>
        <button type="button" class="hc-btn danger" data-delete="${it.id}">删除</button>
      </div>`;
      if (it.status === "succeeded") {
        return `<div class="history-card">
          <video src="${it.video_url || ''}" controls preload="metadata"></video>
          <div class="hc-body">
            <p class="hc-prompt" title="点击复制完整 Prompt">${prompt}</p>
            <div class="hc-meta"><span>${it.mode} · ${fmtTime(it.created_at)}</span><span class="badge ok">成功</span></div>
            ${actions}
          </div>
        </div>`;
      }
      return `<div class="history-card">
        <div class="hc-fail">
          <p class="hc-prompt" title="点击复制完整 Prompt">${prompt}</p>
          <div class="hc-meta"><span>${it.mode} · ${fmtTime(it.created_at)}</span><span class="badge err">失败</span></div>
          ${actions}
        </div>
      </div>`;
    }).join("");
  } catch (e) {
    el.innerHTML = `<div class="empty">历史记录加载失败: ${e}</div>`;
  }
}

// 复用：把这条记录当时的 prompt/时长/分辨率/seed/推理步数填回表单，方便
// 在此基础上改改再生成。fl2va/ref2va 用到的图片/参考文件不会存进历史
// （避免历史文件被塞满二进制数据），所以那种记录复用后需要重新上传。
function reuseEntry(id) {
  const entry = _historyById[id];
  const rs = entry && entry.request_summary;
  if (!rs) return;
  document.getElementById("prompt").value = rs.prompt;
  document.getElementById("duration").value = rs.duration;
  checkDurationField(); // 程序设值不会触发 input 事件，手动校验一次
  document.getElementById("seed").value = rs.seed ?? "";
  document.getElementById("steps").value = (rs.options && rs.options.num_inference_steps) ?? 30;
  const resSelect = document.getElementById("resolution");
  const wh = `${rs.width}x${rs.height}`;
  if ([...resSelect.options].some(o => o.value === wh)) resSelect.value = wh;
  window.scrollTo({ top: 0, behavior: "smooth" });
  document.getElementById("prompt").focus();
  if (rs.had_media_inputs) {
    alert("这条记录当时用了图片/参考文件（FL2VA 或 Ref2VA），历史记录不保存这些文件，需要重新上传。");
  }
}

async function deleteEntry(id) {
  if (!confirm("确定删除这条记录吗？生成的视频文件也会一并删除，不可恢复。")) return;
  try {
    const resp = await fetch(`${API}/v1/videos/${id}`, { method: "DELETE" });
    if (resp.ok || resp.status === 404) {
      refreshHistory();
    } else {
      alert(`删除失败: HTTP ${resp.status}`);
    }
  } catch (e) {
    alert(`删除失败: ${e}`);
  }
}

// prompt 点击复制 / 复用 / 删除 都委托到容器上，避免逐卡片单独绑定。
document.getElementById("history").addEventListener("click", async (e) => {
  const reuseBtn = e.target.closest("[data-reuse]");
  if (reuseBtn) { reuseEntry(reuseBtn.getAttribute("data-reuse")); return; }

  const deleteBtn = e.target.closest("[data-delete]");
  if (deleteBtn) { deleteEntry(deleteBtn.getAttribute("data-delete")); return; }

  const el = e.target.closest(".hc-prompt");
  if (!el) return;
  const text = el.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    // Clipboard API 不可用时的兜底（老浏览器/非安全上下文）
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* 放弃 */ }
    document.body.removeChild(ta);
  }
  el.classList.add("copied");
  setTimeout(() => el.classList.remove("copied"), 800);
});

// 轮询"当前任务"，一旦从"有任务"变成"没任务"就顺带刷新历史和 backend 状态——
// 这样即使生成是别的标签页/curl 发起的，这个页面也会自动跟着更新，不用手动刷新。
let _hadJob = false;
setInterval(async () => {
  await refreshCurrentJob();
  const box = document.getElementById("current-job");
  const hasJob = box.style.display === "block";
  if (_hadJob && !hasJob) {
    refreshHistory();
    refreshBackends();
  }
  _hadJob = hasJob;
}, 3000);

refreshBackends();
refreshHistory();
refreshCurrentJob();
</script>
</body>
</html>
